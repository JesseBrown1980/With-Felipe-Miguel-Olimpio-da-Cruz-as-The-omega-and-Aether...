[package]
name = "asolaria-gnn-trio"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
# The vendored revolver-10k bytes are the owner's, released free and public by the owner's grant
# of 2026-10-18 (PROVENANCE.md). publish = false until the crates.io pass.
license = "MIT OR Apache-2.0"
publish = false
description = "The public, runnable G-plane trio: the G3 reverse-gain sign-flip scorer as an integer Rust port with a synthetic default mask set and a runtime override, the G1/G2/G4 argument-only cores via asolaria-g-planes, and the clean revolver-10k composition files vendored as the owner's float/Node lane"
keywords = ["gnn", "reverse-gain", "integer", "port"]
categories = ["algorithms"]

[lib]
name = "gnn_trio"
path = "src/lib.rs"

[[example]]
name = "trio"
path = "examples/trio.rs"

[dependencies]
# The owner's shadowcat `src/sha256.rs`, the one SHA-256 aether's own code reuses.
shadowcat = { path = "../../shadowcat", version = "0.1.0" }
asolaria-g-planes = { path = "../../model/g-planes", version = "0.1.0" }
asolaria-l0-edge = { path = "../../model/l0-edge", version = "0.1.0" }
