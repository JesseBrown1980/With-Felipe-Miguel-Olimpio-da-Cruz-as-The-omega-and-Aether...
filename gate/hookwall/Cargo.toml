[package]
name = "asolaria-hookwall"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Standalone extract of the asolaria-federation-1024 kernel-core hookwall, spawn/sign/tier gates, Ed25519 envelope signing (ed25519-dalek) and in-memory cosign chain"
readme = "README.md"
repository = "https://github.com/JesseBrown1980/With-Felipe-Miguel-Olimpio-da-Cruz-as-The-omega-and-Aether..."
keywords = ["ed25519", "policy", "gate", "no-std"]
categories = ["cryptography", "no-std"]

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["zeroize"] }
# Upstream declares zeroize "1.7". The "<1.9" bound (owner decision B2, 2026-11-08) keeps a build from the
# package on Rust 1.81: zeroize 1.9.0 and 1.9.1 declare edition 2024 and rust-version 1.85.
zeroize = { version = ">=1.7, <1.9", default-features = false, features = ["derive"] }
# Not upstream. zeroize 1.8.x's "derive" feature asks zeroize_derive "1.3"; this line adds only the "<1.5"
# bound (owner decision B2): zeroize_derive 1.5.0 declares edition 2024 and rust-version 1.85.
zeroize_derive = ">=1.3, <1.5"
sha2 = { version = "0.10", default-features = false }
