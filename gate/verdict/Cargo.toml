[package]
name = "asolaria-verdict"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Tighten-only composition of the hookwall, spawn, tier and Fischer gates plus an input guard into one verdict"
repository = "https://github.com/JesseBrown1980/With-Felipe-Miguel-Olimpio-da-Cruz-as-The-omega-and-Aether..."
keywords = ["policy", "gate", "verdict", "integer"]
categories = ["algorithms"]

[lib]
path = "src/lib.rs"

[dependencies]
asolaria-hookwall = { path = "../hookwall", version = "0.1.0" }
asolaria-server-fischer-eval = { path = "../fischer-eval", version = "0.1.0" }
