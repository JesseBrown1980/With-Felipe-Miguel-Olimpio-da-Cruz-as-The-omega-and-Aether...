[package]
name = "asolaria-hrm-mtp"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Integer port of the Asolaria HRM / MTP / zeta triad (bigpickle-rebuild) and the universe simulator's HRM and MTP slice agents"
