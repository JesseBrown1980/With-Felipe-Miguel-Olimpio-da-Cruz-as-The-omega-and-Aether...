[package]
name = "asolaria-colour"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Integer Rust ports of the Asolaria rainbow and gradiated colour formulas, with the vendored upstream sources"
repository = "https://github.com/JesseBrown1980/With-Felipe-Miguel-Olimpio-da-Cruz-as-The-omega-and-Aether..."
keywords = ["colour", "rainbow", "gguf", "integer", "hbp"]
categories = ["algorithms"]
exclude = ["vendor/rainbow27-check/target"]

[lib]
name = "colour"
path = "src/lib.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
opt-level = 3
