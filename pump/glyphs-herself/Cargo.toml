[package]
name = "pump-glyphs-herself"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Integer hot-lane regeneration of the ASOLARIA-HERSELF and MYTHOS-SELF-GLYPHS-256 GGUFs from their seeds, reproducing the numpy generators (USIM @3f9f42d) byte for byte."

[[bin]]
name = "pump"
path = "src/bin/pump.rs"

[lib]
name = "pump_glyphs_herself"
path = "src/lib.rs"

[dependencies]
asolaria-ternary = { path = "../../ternary", version = "0.1.0" }

[profile.release]
opt-level = 3

[dev-dependencies]
# The owner's shadowcat `src/sha256.rs`, the one SHA-256 aether's own code reuses.
shadowcat = { path = "../../shadowcat" }
