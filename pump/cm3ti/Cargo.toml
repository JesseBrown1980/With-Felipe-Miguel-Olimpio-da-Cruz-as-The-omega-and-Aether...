[package]
name = "asolaria-cm3ti"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
publish = false
description = "Vendored cm3ti integer-deterministic context-mixing compressors (one binary per source file), byte-identical to the owner's honest-compressor tools/honest-compressor/rust tree (ACER export 2026-10-18, cloud session 9ebd6119). Integer compressed path; float lives only in the owner's display/timer lines (see PROVENANCE.md)."
readme = "README.md"

# The vendored sources are byte-identical to the owner's export and are NOT edited.
# Each source is a standalone `fn main()` compressor. One [[bin]] per integer file.
# cm3t.rs is the owner's float reference: vendored byte-identical, NOT built here
# (not in the hot lane). See PROVENANCE.md "The float reference".

[[bin]]
name = "cm3ti"
path = "rust/cm3ti.rs"

