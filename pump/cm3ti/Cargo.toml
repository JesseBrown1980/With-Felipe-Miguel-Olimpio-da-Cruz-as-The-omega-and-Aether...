# Upstream built each file with `rustc --edition 2021 -O` (no overflow checks); the recorded
# comp_sha values were produced that way. The release profile is left at Cargo's defaults
# (overflow-checks off) so the integer codepaths reproduce those bytes exactly. The arithmetic
# that must wrap already uses explicit wrapping_* in the vendored sources.
