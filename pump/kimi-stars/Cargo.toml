[package]
name = "asolaria-pump-kimi-stars"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Integer Rust pump that regenerates KIMI-K3-STAR-256.gguf and ASOLARIA-STARS-SHELLS.gguf, with their receipts, byte-exact from their seeds"
repository = "https://github.com/JesseBrown1980/With-Felipe-Miguel-Olimpio-da-Cruz-as-The-omega-and-Aether..."
keywords = ["gguf", "codex", "integer", "hbp"]
categories = ["algorithms"]

[lib]
name = "pump_kimi_stars"
path = "src/lib.rs"

[[bin]]
name = "pump"
path = "src/main.rs"

[dependencies]
asolaria-colour = { path = "../../colour", version = "0.1.0" }
blake2 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
opt-level = 3
