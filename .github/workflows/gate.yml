name: asolaria-aether gate
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  python-slices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          set -euo pipefail
          python prime_cylinder_expansion.py
          python slice_glyph_messaging.py
  tribit-kernel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kernel/tribit } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy + rustfmt
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy -c rustfmt
      - run: cargo +1.81.0 fmt --check
      - run: cargo +1.81.0 clippy --all-targets -- -D warnings
      - run: cargo +1.81.0 test
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  behcs1024-kernel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kernel/behcs1024-60d } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Rust 1.81 with clippy + rustfmt
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy -c rustfmt
      - name: upstream bytes unchanged
        run: sha256sum -c UPSTREAM.sha256
      - name: extracts equal federation-1024@dc1da1a9 hwinv.rs lines 99-101 and 147-262
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/hwinv.rs" https://raw.githubusercontent.com/JesseBrown1980/asolaria-federation-1024/dc1da1a9cd88b77eb463053312b7c42a7dbe9b33/kernel/boot/src/hwinv.rs
          test "$(git hash-object "$RUNNER_TEMP/hwinv.rs")" = d08bc2a9ba6f3b63fec5249f0670d68c8df744d4
          sed -n '99,101p' "$RUNNER_TEMP/hwinv.rs" | cmp - src/upstream/hwinv-tuple-cap.rs
          sed -n '147,262p' "$RUNNER_TEMP/hwinv.rs" | cmp - src/upstream/hwinv-sha256-project-60d.rs
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: independent referee against the demo binary
        run: |
          cargo +1.81.0 build --bin behcs60-demo
          python -I independent_referee.py target/debug/behcs60-demo
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  qprism-representation:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qprism/representation } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: upstream bytes unchanged
        run: sha256sum -c UPSTREAM.sha256
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' rust-qprism-181/src/; then exit 1; fi
  qprism-recovery:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qprism/recovery/omega } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: upstream bytes unchanged
        run: sha256sum -c UPSTREAM.sha256
      # Three upstream pedantic style lints are allowed so the source stays
      # byte-identical to its owner repo; every other warning still denies.
      - run: >
          cargo +1.81.0 clippy --locked --all-targets --
          -D warnings
          -A clippy::unusual_byte_groupings
          -A clippy::derivable_impls
          -A clippy::needless_range_loop
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' omega-path123-v0/ omega-operator-catalog-v0/; then exit 1; fi
  omega-operator-catalog:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qprism/recovery/catalog } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: upstream bytes unchanged, identical to the copy bundled in recovery
        run: |
          sha256sum -c UPSTREAM.sha256
          cmp omega_operator_catalog.rs ../omega/omega-operator-catalog-v0/omega_operator_catalog.rs
      # Same upstream style lint as the recovery crate; every other warning still denies.
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings -A clippy::unusual_byte_groupings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -nE '\bf32\b|\bf64\b|as f[0-9]' omega_operator_catalog.rs; then exit 1; fi
  qprism-throat:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qprism/recovery/throat } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  time-evolution:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: time } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Deterministic GF(2) evolution + Python/Node byte-identity
        run: python test_three_seat_ci.py

  qprism-eval-watchers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned-source software test dependencies
        run: python -m pip install -r eval/vendor/qprism-control/requirements.txt
      - name: Q-PRISM / N-Nest control and adversarial watcher
        run: python eval/vendor_gate.py
      - name: Retain audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qprism-nnest-software-receipts
          path: eval/artifacts/
          if-no-files-found: ignore
  fischer-gate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gate/fischer-eval } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: sha256 sidecars match
        run: sha256sum -c Cargo.toml.sha256 && (cd src && sha256sum -c lib.rs.sha256)
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - run: cargo +1.81.0 run --locked -q -- --once
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  hookwall-gate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gate/hookwall } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      # Two upstream style lints are allowed so copied logic stays unchanged
      # (see PROVENANCE.md); every other warning still denies.
      - run: >
          cargo +1.81.0 clippy --locked --all-targets --
          -D warnings
          -A clippy::identity_op
          -A clippy::manual_range_contains
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  verdict-compose:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gate/verdict } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/; then exit 1; fi
  verify-schedule:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: proposals/verify-schedule } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: byte-identical to upstream pin
        run: sha256sum -c schedule.rs.sha256
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -nE '\bf32\b|\bf64\b|as f[0-9]' schedule.rs; then exit 1; fi
  gnn-int:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: model/gnn-int } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/ tests/; then exit 1; fi
  l0-edge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: model/l0-edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: upstream bytes unchanged
        run: sha256sum -c UPSTREAM.sha256
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      # Stdlib Python referees mirror the upstream JavaScript and Python line by line;
      # each --check regenerates its committed HBP file in memory and diffs it.
      - name: referees regenerate the committed fixtures and weights
        run: |
          set -euo pipefail
          python3 -I tools/make_fixture.py --check
          python3 -I tools/quantize.py --check
          python3 -I tools/features_referee.py --check
          python3 -I tools/jsnum_referee.py --check
      - name: Math.round over the full extractor grids (gnnDataExport.js:58 and :60)
        run: |
          set -euo pipefail
          python3 -I tools/jsnum_referee.py --grid | cargo +1.81.0 run --locked -q --release --example jsnum_grid
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/ tests/ examples/; then exit 1; fi
  l0-torch-parity:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: model/l0-edge } }
    steps:
      - uses: actions/checkout@v4
      # torch 2.14.1+cpu has a cp313 manylinux_2_28_x86_64 wheel on the CPU index; these are the
      # versions named in the header of tests/fixtures/expected-model.hbp.
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.16' }
      - name: Install torch 2.14.1+cpu and torch_geometric 2.8.1
        run: |
          set -euo pipefail
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch_geometric==2.8.1
      # tools/model_parity.py sets the kernel selection itself (KERNEL_ENV) before torch loads.
      - name: runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - name: vendored inference_server.py MODEL reproduces tests/fixtures/expected-model.hbp
        run: python -I tools/model_parity.py --check
  observed:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gate/observed } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: stdlib Python referee (asolaria-score.mjs line by line) regenerates the committed fixture
        run: python3 -I tools/score_referee.py --check
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/ tests/; then exit 1; fi
  asolaria-cli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - run: cargo +1.81.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.81.0 test --locked
      - name: install exactly as the README says, then run the example envelopes
        run: |
          cargo +1.81.0 install --locked --path . --root "$RUNNER_TEMP/root"
          "$RUNNER_TEMP/root/bin/asolaria" gate examples/envelope.hbp
          # The README's observe example: HOLD, exit 3.
          status=0
          "$RUNNER_TEMP/root/bin/asolaria" observe --events ../model/l0-edge/tests/fixtures/events.hbp examples/observe-envelope.hbp || status=$?
          test "$status" -eq 3
      - name: no float on this path
        run: if grep -rnE '\bf32\b|\bf64\b|as f[0-9]' src/ tests/; then exit 1; fi
