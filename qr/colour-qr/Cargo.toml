[package]
name = "asolaria-colour-qr"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "The owner's colour QR carrier in Rust: three ordinary QR symbols, one per RGB plane, generate and un-generate"
keywords = ["qr", "colour", "carrier", "integer", "hbp"]
categories = ["encoding"]

[lib]
name = "colour_qr"
path = "src/lib.rs"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
png = "=0.17.16"
qrcode = { version = "=0.14.1", default-features = false }
rqrr = { version = "=0.10.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

# The QR, PNG and deflate crates run optimised under `cargo test` so the decode tests stay short.
[profile.dev.package."*"]
opt-level = 3
