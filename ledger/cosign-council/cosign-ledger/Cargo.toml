[package]
name = "asolaria-server-cosign-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["Asolaria Federation"]
description = "Cosign-chain ledger of asolaria-federation-1024 (byte-identical src/): the CosignChain scaffold, the module-level append counter, and the py_parity row canon, sha16 and shadow-append chain"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

# The dependency set of the upstream manifest (vendor/federation-1024/servers/cosign-ledger/Cargo.toml:16-18),
# with the upstream workspace lines (federation-1024 Cargo.toml:46,53) written in. ed25519-dalek is
# declared upstream; no line of src/ uses it.
[dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["zeroize"] }
