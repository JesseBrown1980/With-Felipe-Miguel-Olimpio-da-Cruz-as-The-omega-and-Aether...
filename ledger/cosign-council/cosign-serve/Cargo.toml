[package]
name = "asolaria-server-cosign-serve"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["Asolaria Federation"]
description = "cosign-serve of asolaria-federation-1024 as an in-process library: shadow-ledger open/resume, the five routes and the shadow append, without the TCP listener"
build = "build.rs"
# src/main.rs is upstream's binary (it binds 127.0.0.1:5091). It is carried byte-identical and is not a
# target here: build.rs takes its non-listener line ranges (EXTRACTS.sha256).
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
asolaria-server-cosign-ledger = { path = "../cosign-ledger", version = "0.1.0" }
